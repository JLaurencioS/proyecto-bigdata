<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Fleet Tracking</title>
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <!-- Login -->
    <main id="login-view" class="login" hidden>
      <form id="login-form" class="card" novalidate>
        <h1>Smart Fleet Tracking</h1>
        <p class="muted">Inicia sesión para continuar</p>
        <label>Usuario
          <input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" required />
        </label>
        <label>Contraseña
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required />
        </label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </main>

    <!-- App -->
    <div id="app-view" class="app" hidden>
      <header class="topbar">
        <strong>Smart Fleet Tracking</strong>
        <span class="spacer"></span>
        <span id="user-info" class="muted"></span>
        <button id="logout-btn" class="btn btn-ghost">Salir</button>
      </header>

      <aside class="sidebar">
        <h2>Zonas de NYC</h2>
        <input id="search" type="search" placeholder="Buscar zona…" aria-label="Buscar zona" />
        <select id="borough-filter" aria-label="Filtrar por borough"></select>
        <p id="count" class="muted"></p>
        <ul id="zone-list" class="zone-list"></ul>
        <p id="zones-error" class="error" role="alert" hidden></p>
      </aside>

      <section class="map-wrap">
        <div id="map" aria-label="Mapa de zonas"></div>
        <div id="zone-info" class="zone-info" hidden></div>
      </section>
    </div>

    <script src="/vendor/leaflet/leaflet.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
